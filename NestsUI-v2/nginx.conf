server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Mirrors the CSP meta tag in index.html so the policy also covers
    # error pages and responses that never render the meta tag
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://fonts.cdnfonts.com https://use.typekit.net; frame-src 'self' https:; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net https://fonts.cdnfonts.com https://use.typekit.net; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: http: https: wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; worker-src 'self' blob:" always;
    # The app needs the microphone; deny everything else we don't use
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
